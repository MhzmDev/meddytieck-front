<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [dismissableMask]="true"
  closable="false"
  [style]="{ width: '30rem' }"
>
  <div class="flex flex-col items-center gap-8 py-4">
    <div
      class="flex items-center gap-2"
      [ngClass]="iconClass"
      class="h-[10rem] w-[10rem]"
    >
      @let iconText = icon();
      @if (iconText) {
        <mtk-icon [icon]="iconText" overrideColor overrideSize />
      }
    </div>
    <div class="flex flex-col gap-4">
      @let titleText = title();
      @let subtitleText = subtitle();
      @if (titleText) {
        <p class="text-surface-700 text-center text-2xl font-bold">
          {{ titleText | translate }}
        </p>
      }
      @if (subtitleText) {
        <p class="text-surface-500 text-center text-lg font-bold">
          {{ subtitleText | translate }}
        </p>
      }
    </div>
  </div>
  <ng-template pTemplate="footer">
    <div class="grid w-full grid-cols-2 gap-4">
      <p-button
        [label]="confirmButtonLabel() | translate"
        [severity]="confirmButtonSeverity()"
        [loading]="confirmButtonLoading()"
        styleClass="w-full"
        size="large"
        (onClick)="onConfirmButtonClick()"
      />
      <p-button
        [label]="cancelButtonLabel() | translate"
        severity="secondary"
        styleClass="w-full"
        size="large"
        (onClick)="onCancelButtonClick()"
      />
    </div>
  </ng-template>
</p-dialog>
