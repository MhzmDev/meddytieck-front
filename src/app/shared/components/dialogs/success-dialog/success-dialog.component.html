<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [dismissableMask]="true"
  [style]="{ width: '30rem' }"
>
  <div class="flex flex-col items-center gap-8 py-4">
    <div class="flex h-[10rem] w-[10rem] items-center justify-center gap-2">
      <mtk-icon [icon]="icon()" overrideSize />
    </div>
    <p class="text-surface-700 text-center text-2xl font-bold">
      {{ title() | translate }}
    </p>
  </div>
</p-dialog>
