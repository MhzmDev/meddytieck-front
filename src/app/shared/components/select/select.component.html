<div class="flex flex-col gap-2">
  @if (label()) {
    <label [for]="id()" class="text-sm font-bold">
      {{ label() }}
    </label>
  }
  <p-select
    [id]="id()"
    [formControl]="control"
    [options]="options()"
    [optionLabel]="getLabel()"
    [optionValue]="optionValue()"
    [placeholder]="placeholder()"
    [loading]="loading()"
    [appendTo]="appendTo()"
    class="w-full"
    [fluid]="true"
    [showClear]="showClear()"
    [disabled]="disabled()"
  />
</div>
